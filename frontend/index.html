<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover, shrink-to-fit=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <title>Talaen Farm Management System</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'inter': ['Inter', 'system-ui', '-apple-system', 'sans-serif'] },
                    colors: {
                        'brand': { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#059669',700:'#047857',800:'#065f46',900:'#064e3b' },
                        'slate': { 750:'#1e293b',850:'#1a1a2e',950:'#0f0f23' }
                    }
                }
            }
        }
    </script>
    <!-- NO more internal <style> block overriding login modal display -->
</head>
<body class="font-inter bg-stone-50 antialiased overflow-x-hidden">
    
    <div id="appBackground" class="fixed inset-0 z-0 bg-cover bg-center bg-no-repeat transition-all duration-700" style="background-image: url('https://images.unsplash.com/photo-1499529112087-3cb3b73cec95?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80');">
        <div class="absolute inset-0 bg-gradient-to-br from-slate-900/80 via-slate-800/70 to-slate-900/80"></div>
    </div>
    
    <!-- Login Modal - Pure Inline Styles for Centering -->
    <div id="loginModal" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 12px;">
        <div style="width: 100%; max-width: 360px;">
            <div style="background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 25px 50px rgba(0,0,0,0.25);">
                
                <!-- Header -->
                <div style="position: relative; height: 120px; overflow: hidden;">
                    <div style="position: absolute; inset: 0; clip-path: polygon(0 0, 100% 0, 0 100%);">
                        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" style="width: 100%; height: 100%; object-fit: cover;">
                        <div style="position: absolute; inset: 0; background: linear-gradient(135deg, rgba(6,78,59,0.6), rgba(6,78,59,0.4));"></div>
                    </div>
                    <div style="position: absolute; inset: 0; clip-path: polygon(100% 0, 100% 100%, 0 100%);">
                        <img src="https://images.unsplash.com/photo-1570042225831-d98fa7577f1e?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" style="width: 100%; height: 100%; object-fit: cover;">
                        <div style="position: absolute; inset: 0; background: linear-gradient(315deg, rgba(8,47,73,0.6), rgba(8,47,73,0.4));"></div>
                    </div>
                    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 20;">
                        <div style="width: 48px; height: 48px; background: #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; border: 2px solid rgba(255,255,255,0.5); overflow: hidden;">
                            <img src="assets/images/logo.png.jpg" style="width: 32px; height: 32px; object-fit: cover;" onerror="this.style.display='none'; this.parentElement.innerHTML='<i style=\"color:white;font-size:20px\" class=\"fas fa-tractor\"></i>'">
                        </div>
                    </div>
                    <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: linear-gradient(transparent, rgba(0,0,0,0.6));"></div>
                    <h1 style="position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; color: white; font-size: 16px; font-weight: 800; margin: 0; z-index: 10;">Talaen Farm</h1>
                </div>
                
                <!-- Form -->
                <div style="padding: 16px;">
                    <form id="loginForm" style="display: flex; flex-direction: column; gap: 12px;">
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px;">Username</label>
                            <input type="text" id="username" required 
                                style="width: 100%; padding: 10px 12px; background: #fafaf9; border: 2px solid #e7e5e4; border-radius: 12px; font-size: 14px; outline: none; box-sizing: border-box;"
                                placeholder="Enter your username">
                        </div>
                        <div>
                            <label style="display: block; font-size: 12px; font-weight: 600; color: #334155; margin-bottom: 4px;">Password</label>
                            <div style="position: relative;">
                                <input type="password" id="password" required 
                                    style="width: 100%; padding: 10px 40px 10px 12px; background: #fafaf9; border: 2px solid #e7e5e4; border-radius: 12px; font-size: 14px; outline: none; box-sizing: border-box;"
                                    placeholder="Enter your password">
                                <button type="button" id="togglePassword" style="position: absolute; right: 0; top: 0; bottom: 0; padding: 0 12px; background: none; border: none; color: #a8a29e; cursor: pointer; font-size: 14px;">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" 
                            style="width: 100%; padding: 12px; background: linear-gradient(135deg, #059669, #047857); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 48px;">
                            <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>Sign In
                        </button>
                    </form>
                    <div id="loginError" style="display: none; margin-top: 8px; padding: 8px 12px; background: #fef2f2; border: 1px solid #fecaca; border-radius: 12px; color: #ef4444; font-size: 12px; text-align: center;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="appContainer" class="hidden relative z-10 min-h-screen w-full">
        
        <div id="sidebar" class="flex flex-col w-72 max-w-[85vw] bg-slate-850 text-slate-200 fixed h-full z-30 shadow-2xl border-r border-slate-700/50">
            <div class="p-4 sm:p-6 border-b border-slate-700/50 flex-shrink-0">
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="w-10 h-10 sm:w-14 sm:h-14 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-xl flex items-center justify-center overflow-hidden shadow-lg flex-shrink-0">
                        <img src="assets/images/logo.png.jpg" alt="Logo" class="w-6 h-6 sm:w-full sm:h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-tractor text-white text-lg sm:text-2xl\'></i>'">
                    </div>
                    <div>
                        <h2 class="text-base sm:text-lg font-bold text-white tracking-tight">Talaen Farm</h2>
                        <p id="sidebarRole" class="text-slate-400 text-[10px] sm:text-[11px] leading-tight"></p>
                    </div>
                </div>
            </div>
            <nav id="sidebarNav" class="flex-1 overflow-y-auto py-3 sm:py-4 px-2 sm:px-3 space-y-0.5 sidebar-scroll"></nav>
            <div class="p-3 sm:p-4 border-t border-slate-700/50 flex-shrink-0">
                <button id="logoutBtn" class="w-full bg-red-500/10 active:bg-red-500/20 text-red-300 py-2.5 sm:py-3 rounded-xl transition-all text-xs sm:text-sm font-medium flex items-center justify-center gap-2 border border-red-500/20 active:border-red-500/30 min-h-[44px]">
                    <i class="fas fa-sign-out-alt"></i>Logout
                </button>
            </div>
        </div>
        
        <div id="sidebarOverlay" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-20 lg:hidden sidebar-overlay-tap"></div>
        
        <div class="flex-1 w-full lg:ml-72">
            <div id="mobileNavbar" class="lg:hidden bg-white/95 backdrop-blur-md shadow-sm px-3 sm:px-4 py-3 flex items-center justify-between sticky top-0 z-10 border-b border-stone-200 safe-top">
                <button id="hamburgerBtn" class="text-slate-600 active:text-emerald-700 transition-colors w-10 h-10 flex items-center justify-center rounded-xl active:bg-stone-100 min-tap flex-shrink-0">
                    <i class="fas fa-bars text-lg sm:text-xl"></i>
                </button>
                <div class="flex items-center gap-2 flex-shrink-0">
                    <div class="w-8 h-8 sm:w-9 sm:h-9 bg-gradient-to-br from-emerald-500 to-emerald-700 rounded-lg flex items-center justify-center overflow-hidden">
                        <img src="assets/images/logo.png.jpg" alt="Logo" class="w-5 h-5 sm:w-full sm:h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<i class=\'fas fa-tractor text-white text-xs sm:text-sm\'></i>'">
                    </div>
                    <h2 class="font-bold text-slate-800 text-sm sm:text-base truncate">Talaen Farm</h2>
                </div>
                <div class="w-10 flex-shrink-0"></div>
            </div>
            <main id="mainContent" class="p-3 sm:p-4 md:p-6 lg:p-8 safe-bottom w-full"></main>
        </div>
    </div>

    <div id="toastContainer" class="fixed top-4 right-2 sm:right-4 z-50 space-y-2 sm:space-y-3 w-[calc(100%-1rem)] sm:w-auto max-w-sm"></div>
    <div id="modalContainer" class="hidden fixed inset-0 z-40 flex items-end sm:items-center justify-center sm:p-4 bg-black/60 backdrop-blur-sm">
        <div id="modalContent" class="bg-white rounded-t-2xl sm:rounded-2xl shadow-2xl w-full sm:max-w-lg max-h-[92vh] sm:max-h-[90vh] overflow-y-auto border border-stone-200 modal-slide-up"></div>
    </div>

    <!-- All login/logout logic is now handled by auth.js -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/router.js"></script>
    <script src="js/background.js"></script>
    <script src="js/components/toast.js"></script>
    <script src="js/components/modal.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/modules/moduleSelector.js"></script>
    <script src="js/modules/userManagement.js"></script>
    <script src="js/modules/tea/teaDashboard.js"></script>
    <script src="js/modules/tea/workers.js"></script>
    <script src="js/modules/tea/companies.js"></script>
    <script src="js/modules/tea/blocks.js"></script>
    <script src="js/modules/tea/wageRate.js"></script>
    <script src="js/modules/tea/pluckingSelf.js"></script>
    <script src="js/modules/tea/pluckingVerified.js"></script>
    <script src="js/modules/tea/comparison.js"></script>
    <script src="js/modules/tea/debts.js"></script>
    <script src="js/modules/tea/payWorker.js"></script>
    <script src="js/modules/tea/payStore.js"></script>
    <script src="js/modules/tea/reports.js"></script>
    <script src="js/modules/tea/workerDashboard.js"></script>
    <script src="js/modules/tea/workerPlucking.js"></script>
    <script src="js/modules/tea/workerDebts.js"></script>
    <script src="js/modules/tea/workerStorePurchases.js"></script>
    <script src="js/modules/tea/workerPayments.js"></script>
    <script src="js/modules/tea/workerProfile.js"></script>
    <script src="js/modules/tea/storeDashboard.js"></script>
    <script src="js/modules/tea/storeWorkerDebts.js"></script>
    <script src="js/modules/tea/storeProfile.js"></script>
    <script src="js/modules/tea/farmInputs.js"></script>
    <script src="js/modules/tea/productionTargets.js"></script>
    <script src="js/modules/tea/inputCosts.js"></script>
    <script src="js/modules/tea/fertilizerSchedule.js"></script>
    <script src="js/modules/tea/pruningSchedule.js"></script>
    <script src="js/modules/tea/seasonalAnalysis.js"></script>
    <script src="js/modules/dairy/dairyDashboard.js"></script>
    <script src="js/modules/dairy/cows.js"></script>
    <script src="js/modules/dairy/dairyWorkers.js"></script>
    <script src="js/modules/dairy/buyers.js"></script>
    <script src="js/modules/dairy/milkProduction.js"></script>
    <script src="js/modules/dairy/milkDisposal.js"></script>
    <script src="js/modules/dairy/feed.js"></script>
    <script src="js/modules/dairy/payDairyWorker.js"></script>
    <script src="js/modules/dairy/deliveries.js"></script>
    <script src="js/modules/dairy/buyerPayments.js"></script>
    <script src="js/modules/dairy/dairyReports.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
